name: Methodology proposal
description: Propose a platform-agnostic core rule, artifact, template, or evaluation
title: "[Proposal] "
labels: []
body:
  - type: textarea
    id: failure_mode
    attributes:
      label: Failure mode
      description: What recurring redesign problem does this solve?
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: What examples, fixtures, or observed failures support the proposal?
    validations:
      required: true
  - type: dropdown
    id: scope
    attributes:
      label: Proposed scope
      options:
        - Core methodology
        - Reference
        - Template
        - Evaluation
        - Example
        - Integration only
    validations:
      required: true
  - type: textarea
    id: contract
    attributes:
      label: Proposed behavioral or artifact contract
      description: Describe observable behavior rather than a tool-specific implementation.
    validations:
      required: true
  - type: textarea
    id: portability
    attributes:
      label: Platform independence
      description: Explain why the proposal does not require a specific model, design tool, frontend framework, CMS, or hosting provider.
    validations:
      required: true
  - type: textarea
    id: evaluation
    attributes:
      label: Evaluation plan
      description: How could the change be validated or tested?
