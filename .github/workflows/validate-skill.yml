name: Validate Skill

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate skill
        run: python3 scripts/validate_skill.py

      - name: Validate benchmarks
        run: python3 scripts/validate_benchmarks.py

      - name: Report release readiness
        run: python3 scripts/release_status.py
