name: Vue profile pilot

on:
  push:
    branches: [main]
    paths:
      - 'examples/project-profile-vue/**'
      - 'integrations/vue-project-profile/**'
      - 'scripts/inspect_project_profile.py'
      - 'integrations/context-aware-ui/project-profile.schema.json'
      - '.github/workflows/vue-profile-pilot.yml'
  pull_request:
    paths:
      - 'examples/project-profile-vue/**'
      - 'integrations/vue-project-profile/**'
      - 'scripts/inspect_project_profile.py'
      - 'integrations/context-aware-ui/project-profile.schema.json'
      - '.github/workflows/vue-profile-pilot.yml'

permissions:
  contents: read

jobs:
  profile-and-render:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: integrations/vue-project-profile/package-lock.json
      - name: Install optional pilot tooling
        working-directory: integrations/vue-project-profile
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test supported syntax and refusal conditions
        working-directory: integrations/vue-project-profile
        run: npm test
      - name: Inspect fixture and validate portable profile
        run: |
          mkdir -p integrations/vue-project-profile/artifacts
          node integrations/vue-project-profile/inspect.mjs examples/project-profile-vue --entry src/main.ts --contract profile-contract.json > integrations/vue-project-profile/artifacts/source-profile.json
          python3 -m pip install jsonschema==4.26.0
          python3 integrations/vue-project-profile/validate-profile.py
      - name: Install browser
        working-directory: integrations/vue-project-profile
        run: npx playwright install --with-deps chromium
      - name: Build and verify rendered token consumers
        run: node integrations/vue-project-profile/render.mjs examples/project-profile-vue
      - name: Preserve profile and rendered evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vue-profile-evidence
          path: |
            integrations/vue-project-profile/artifacts/*.json
            integrations/vue-project-profile/artifacts/*.png
          if-no-files-found: error
